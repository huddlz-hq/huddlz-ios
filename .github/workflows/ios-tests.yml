name: iOS tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-toolchain:
    name: Xcode 27.1 compiler compatibility
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify stable toolchain
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = "Xcode 27.1"
          test "$(xcodebuild -version | tail -1)" = "Build version 27A9275"

      - name: Build all test targets
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Huddlz/Huddlz.xcodeproj \
            -scheme Huddlz \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS="$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/HuddlzLatestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/latest-debug-build.log"

      - name: Build Release app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Huddlz/Huddlz.xcodeproj \
            -scheme Huddlz \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS="$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/HuddlzLatestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/latest-release-build.log"

      - name: Save compiler logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-latest-compiler-results
          path: |
            ${{ runner.temp }}/latest-debug-build.log
            ${{ runner.temp }}/latest-release-build.log
          retention-days: 7

  # The store rules compile and run on the Mac itself, so they need no
  # Simulator and finish before the UI jobs have booted one.
  store-rules:
    name: Store rules
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run store rules
        run: |
          set -o pipefail
          swift --version
          swift test 2>&1 | tee "$RUNNER_TEMP/store-rules.log"
          grep -Eq 'Test run with [1-9][0-9]* tests in [0-9]+ suites passed' "$RUNNER_TEMP/store-rules.log"

  test:
    name: Behavior tests (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        # A pull request waits for the five core journeys on one Simulator.
        # A push to main runs every UI journey across four Simulators. There
        # the first three parts each run only the classes they list, and the
        # last skips all of those, so a new test class always runs there
        # without an edit here; it also runs the store rules inside the
        # Simulator.
        part: ${{ fromJSON(github.event_name == 'pull_request' && '["core-journeys"]' || '["maps-and-joining","rsvp-and-signup","account-and-groups","everything-else"]') }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PART: ${{ matrix.part }}
      MAPS_AND_JOINING: DiscoveryVenueUITests JoiningUITests AgendaTabUITests TabsUITests DiscoveryPagingUITests
      RSVP_AND_SIGNUP: RSVPUITests RegistrationUITests SignupLocationUITests
      ACCOUNT_AND_GROUPS: SignupCityUITests AccountUITests GroupsTabUITests
      # One journey each for launching, signing in, finding a huddl, RSVPing,
      # and creating an account.
      CORE_JOURNEYS: >-
        TabsUITests/testLaunchingShowsDiscoverWithItsSearchFieldAndACollapsedTabPill
        AccountUITests/testSigningInReturnsToBrowsingAndShowsTheAccount
        DiscoveryUITests/testSearchingAndOpeningACardShowsCurrentDetailsWithoutSignIn
        RSVPUITests/testRSVPAndCancellationUpdateYourAttendance
        RegistrationUITests/testCreatingAnAccountRequiresAcceptanceAndReturnsToBrowsingWithASavedSession
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Build before booting. A booting Simulator takes the runner's three
      # cores, and building beside it took six minutes instead of one.
      - name: Build tests
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild build-for-testing \
            -project Huddlz/Huddlz.xcodeproj \
            -scheme Huddlz \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS="$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/HuddlzDerivedData" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      # A hosted runner's Simulator has never booted. Its first boot builds
      # 1.3 GB of device data and took 1 to 8 minutes of the runner's three
      # cores, and the first tests then ran beside the leftover work. So one
      # run boots the Simulator, shuts it down, and caches its data; later
      # runs on the same runner image restore it and boot in seconds.
      - name: Find Simulator
        id: simulator
        run: |
          sudo mdutil -a -i off > /dev/null 2>&1 || true
          simulator_id="$(xcrun simctl list devices available --json | jq -er '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-26-5"]
            | map(select(.name == "iPhone 17"))
            | if length == 1 then .[0].udid else error("Expected one iPhone 17 simulator") end
          ')"
          echo "HUDDLZ_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          echo "data=$HOME/Library/Developer/CoreSimulator/Devices/$simulator_id" >> "$GITHUB_OUTPUT"
          echo "key=booted-simulator-v1-$ImageOS-$ImageVersion-$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Restore booted Simulator data
        id: booted
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.simulator.outputs.data }}
          key: ${{ steps.simulator.outputs.key }}

      - name: Boot Simulator for the first time
        if: steps.booted.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          xcrun simctl bootstatus "$HUDDLZ_SIMULATOR_ID" -b
          xcrun simctl shutdown "$HUDDLZ_SIMULATOR_ID"

      - name: Save booted Simulator data
        if: steps.booted.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.simulator.outputs.data }}
          key: ${{ steps.simulator.outputs.key }}

      - name: Start Simulator
        timeout-minutes: 15
        run: |
          # CoreSimulator read the device before its data was restored.
          killall -9 com.apple.CoreSimulator.CoreSimulatorService 2> /dev/null || true
          du -sh "$HOME/Library/Developer/CoreSimulator/Devices/$HUDDLZ_SIMULATOR_ID"
          xcrun simctl bootstatus "$HUDDLZ_SIMULATOR_ID" -b | tail -3

      # Experiment: a Simulator that has just booted spends minutes of the
      # runner's three cores on stock widgets and background services. Stop
      # the ones no test needs and see what the launch and the tests gain.
      - name: Quiet the Simulator
        timeout-minutes: 3
        run: |
          busy() { ps -Ao %cpu,comm -r | grep CoreSimulator | head -12 | sed -E 's#^ *([0-9.]+) .*/#\1 #' || true; }
          echo "Busiest Simulator processes before:"; busy
          noisy='news|health|fitcore|fitness|amsengagement|shortcut|people|chronod|widget|weather|stocks|tips|calendar'
          domain="user/501"
          xcrun simctl spawn "$HUDDLZ_SIMULATOR_ID" launchctl print "$domain" 2> /dev/null |
            grep -Eo 'com\.apple\.[A-Za-z0-9._-]+' | sort -u | grep -Ei "$noisy" > "$RUNNER_TEMP/noisy-services" || true
          echo "$(wc -l < "$RUNNER_TEMP/noisy-services") services to stop"
          time xargs -P 12 -I{} sh -c "xcrun simctl spawn $HUDDLZ_SIMULATOR_ID launchctl bootout $domain/{} 2> /dev/null || true" < "$RUNNER_TEMP/noisy-services"
          sleep 5
          echo "Busiest Simulator processes after:"; busy

      # The first launch of any app on a Simulator that has just booted has
      # taken over a minute on hosted runners. XCUITest gives a launch 60
      # seconds, then xcodebuild hung on the next one until the job timed out.
      # So the app launches once here, against an empty response script that
      # keeps it off the network, before the tests start their clock. The
      # permission service is as slow to wake: a test's own reset of location
      # access timed out at 30 seconds, so the first reset happens here too.
      - name: Launch the app once
        timeout-minutes: 6
        env:
          SIMCTL_CHILD_HUDDLZ_UI_HTTP_SCRIPT: "[]"
          SIMCTL_CHILD_HUDDLZ_UI_SESSION_ID: first-launch
        run: |
          app="$RUNNER_TEMP/HuddlzDerivedData/Build/Products/Debug-iphonesimulator/Huddlz.app"
          time xcrun simctl install "$HUDDLZ_SIMULATOR_ID" "$app"
          time xcrun simctl launch "$HUDDLZ_SIMULATOR_ID" com.huddlz.Huddlz
          time xcrun simctl privacy "$HUDDLZ_SIMULATOR_ID" reset location com.huddlz.Huddlz
          sleep 10
          xcrun simctl terminate "$HUDDLZ_SIMULATOR_ID" com.huddlz.Huddlz

      # One booted Simulator per job, tests in sequence. Cloning Simulators for
      # parallel workers took over 12 minutes on hosted runners before the
      # first test ran, so the suite is split across jobs instead.
      - name: Run behavior tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          selection=()
          case "$PART" in
            core-journeys) journeys="$CORE_JOURNEYS" ;;
            maps-and-joining) journeys="$MAPS_AND_JOINING" ;;
            rsvp-and-signup) journeys="$RSVP_AND_SIGNUP" ;;
            account-and-groups) journeys="$ACCOUNT_AND_GROUPS" ;;
            *) journeys="" ;;
          esac
          if [ -n "$journeys" ]; then
            for journey in $journeys; do selection+=("-only-testing:HuddlzUITests/$journey"); done
          else
            for journey in $MAPS_AND_JOINING $RSVP_AND_SIGNUP $ACCOUNT_AND_GROUPS; do
              selection+=("-skip-testing:HuddlzUITests/$journey")
            done
          fi
          printf '%s\n' "${selection[@]}"
          xcodebuild test-without-building \
            -project Huddlz/Huddlz.xcodeproj \
            -scheme Huddlz \
            -destination "platform=iOS Simulator,id=$HUDDLZ_SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            "${selection[@]}" \
            -derivedDataPath "$RUNNER_TEMP/HuddlzDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/HuddlzTests.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify test results
        run: |
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/HuddlzTests.xcresult" > "$RUNNER_TEMP/test-summary.json"
          python3 - "$RUNNER_TEMP/test-summary.json" <<'PYRESULT'
          import json
          import sys
          with open(sys.argv[1]) as result_file:
              result = json.load(result_file)
          print(f'{result["result"]}: {result["totalTestCount"]} tests, {result["failedTests"]} failed, {result["skippedTests"]} skipped')
          if result["result"] != "Passed" or result["totalTestCount"] == 0 or result["skippedTests"] != 0:
              sys.exit("The suite must run its tests successfully without skips")
          PYRESULT

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results-${{ matrix.part }}
          path: |
            ${{ runner.temp }}/HuddlzTests.xcresult
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/test-summary.json
          retention-days: 7

  required-tests:
    name: Native behavior tests
    runs-on: ubuntu-latest
    needs: [store-rules, test, latest-toolchain]
    if: always()
    steps:
      - name: Require the behavior tests and compiler check to pass
        env:
          STORE_RULES_RESULT: ${{ needs.store-rules.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COMPILER_RESULT: ${{ needs.latest-toolchain.result }}
        run: |
          test "$STORE_RULES_RESULT" = success
          test "$TEST_RESULT" = success
          test "$COMPILER_RESULT" = success

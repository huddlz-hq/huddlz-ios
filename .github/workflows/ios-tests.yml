name: iOS tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-toolchain:
    name: Xcode 27.1 compiler compatibility
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify stable toolchain
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = "Xcode 27.1"
          test "$(xcodebuild -version | tail -1)" = "Build version 27A9275"

      - name: Build all test targets
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Huddlz/Huddlz.xcodeproj \
            -scheme Huddlz \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS="$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/HuddlzLatestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/latest-debug-build.log"

      - name: Build Release app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Huddlz/Huddlz.xcodeproj \
            -scheme Huddlz \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS="$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/HuddlzLatestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/latest-release-build.log"

      - name: Save compiler logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-latest-compiler-results
          path: |
            ${{ runner.temp }}/latest-debug-build.log
            ${{ runner.temp }}/latest-release-build.log
          retention-days: 7

  test:
    name: Behavior tests (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [accounts, rsvp-and-discovery, location-and-joining, remaining]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Start Simulator
        timeout-minutes: 2
        run: |
          simulator_id="$(xcrun simctl list devices available --json | jq -er '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-26-5"]
            | map(select(.name == "iPhone 17"))
            | if length == 1 then .[0].udid else error("Expected one iPhone 17 simulator") end
          ')"
          xcrun simctl boot "$simulator_id"
          echo "HUDDLZ_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Build tests while Simulator starts
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Huddlz/Huddlz.xcodeproj \
            -scheme Huddlz \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS="$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/HuddlzDerivedData" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Wait for Simulator readiness
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$HUDDLZ_SIMULATOR_ID" -b

      - name: Run behavior tests
        env:
          TEST_GROUP: ${{ matrix.suite }}
        run: |
          set -o pipefail
          selection="$(python3 scripts/ci-test-selection.py "$TEST_GROUP")"
          test_selection=()
          while IFS= read -r argument; do
            test_selection+=("$argument")
          done <<< "$selection"
          xcodebuild test-without-building \
            -project Huddlz/Huddlz.xcodeproj \
            -scheme Huddlz \
            -destination "platform=iOS Simulator,id=$HUDDLZ_SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            "${test_selection[@]}" \
            -derivedDataPath "$RUNNER_TEMP/HuddlzDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/HuddlzTests.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify test results
        run: |
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/HuddlzTests.xcresult" > "$RUNNER_TEMP/test-summary.json"
          python3 - "$RUNNER_TEMP/test-summary.json" <<'PYRESULT'
          import json
          import sys
          with open(sys.argv[1]) as result_file:
              result = json.load(result_file)
          print(f'{result["result"]}: {result["totalTestCount"]} tests, {result["failedTests"]} failed, {result["skippedTests"]} skipped')
          if result["result"] != "Passed" or result["totalTestCount"] == 0 or result["skippedTests"] != 0:
              sys.exit("Every group must run its tests successfully without skips")
          PYRESULT

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/HuddlzTests.xcresult
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/test-summary.json
          retention-days: 7

  required-tests:
    name: Native behavior tests
    runs-on: ubuntu-latest
    needs: [test, latest-toolchain]
    if: always()
    steps:
      - name: Require every test group and compiler check to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          COMPILER_RESULT: ${{ needs.latest-toolchain.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$COMPILER_RESULT" = success

name: iOS tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Behavior tests (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [discovery, remaining]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Wait for Simulator readiness
        timeout-minutes: 5
        run: |
          simulator_id="$(xcrun simctl list devices available --json | jq -er '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-26-5"]
            | map(select(.name == "iPhone 17"))
            | if length == 1 then .[0].udid else error("Expected one iPhone 17 simulator") end
          ')"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "HUDDLZ_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Run behavior tests
        run: |
          set -o pipefail
          discovery_classes=(DiscoveryUITests DiscoveryPagingUITests DiscoveryLocationUITests DiscoveryVenueUITests DiscoveryArtworkUITests)
          test_selection=()
          for test_class in "${discovery_classes[@]}"; do
            if [[ "${{ matrix.suite }}" == "discovery" ]]; then
              test_selection+=("-only-testing:HuddlzUITests/$test_class")
            else
              test_selection+=("-skip-testing:HuddlzUITests/$test_class")
            fi
          done
          xcodebuild test \
            -project Huddlz/Huddlz.xcodeproj \
            -scheme Huddlz \
            -destination "platform=iOS Simulator,id=$HUDDLZ_SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            "${test_selection[@]}" \
            -derivedDataPath "$RUNNER_TEMP/HuddlzDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/HuddlzTests.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/HuddlzTests.xcresult
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

  required-tests:
    name: Native behavior tests
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Require every test group to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
